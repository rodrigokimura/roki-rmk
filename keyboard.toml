[keyboard]
name = "RoKi"
product_name = "RoKi Keyboard"
vendor_id = 0x4c4b
product_id = 0x524b
manufacturer = "RoKi"
chip = "nrf52840"

[rmk]
ble_profiles_num = 3

[layout]
rows = 5
cols = 12
layers = 2
matrix_map = """
(0, 0, L) (0, 1, L) (0, 2, L) (0, 3, L) (0, 4, L) (0, 5, L)    (0, 6, R) (0, 7, R) (0, 8, R) (0, 9, R) (0, 10, R) (0, 11, R)
(1, 0, L) (1, 1, L) (1, 2, L) (1, 3, L) (1, 4, L) (1, 5, L)    (1, 6, R) (1, 7, R) (1, 8, R) (1, 9, R) (1, 10, R) (1, 11, R)
(2, 0, L) (2, 1, L) (2, 2, L) (2, 3, L) (2, 4, L) (2, 5, L)    (2, 6, R) (2, 7, R) (2, 8, R) (2, 9, R) (2, 10, R) (2, 11, R)
(3, 0, L) (3, 1, L) (3, 2, L) (3, 3, L) (3, 4, L) (3, 5, L)    (3, 6, R) (3, 7, R) (3, 8, R) (3, 9, R) (3, 10, R) (3, 11, R)
(4, 0, L) (4, 1, L) (4, 2, L) (4, 3, L) (4, 4, L) (4, 5, L)    (4, 6, R) (4, 7, R) (4, 8, R) (4, 9, R) (4, 10, R) (4, 11, R)
"""

[[layer]] # Layer 0
keys = """
           Escape Kc1   Kc2   Kc3   Kc4   Kc5   Kc6 Kc7       Kc8   Kc9   Kc0       Escape
           Tab    Q     W     E     R     T     Y   U         I     O     P         Grave
           LShift A     S     D     F     G     H   J         K     L     Slash     RShift
           MO(1)  Z     X     C     V     B     N   M         Comma Dot   Backslash MO(1)
           LCtrl  LGui  LAlt  Space Enter No    No  Backspace Space RAlt  RGui      RCtrl
"""
encoders = [["AudioVolUp", "AudioVolDown"], ["AudioVolUp", "AudioVolDown"]]

[[layer]] # Layer 1
keys = """
         F1 F2 F3 F4 F5 F6      F7 F8 F9 F10 F11 F12
         User5 User0  User1 User2 _ _     MouseLeft MouseDown MouseUp MouseRight MediaPlayPause AudioVolUp
         LShift Quote _ _ _ _     Left Down Up Right _ AudioVolDown
         MO(1) _ _ Semicolon _ _  Minus Equal LeftBracket _ _ MO(1)
         LCtrl LGui LAlt _ _ _     _ Delete _ RAlt RGui RCtrl
"""
encoders = [["Up", "Down"], ["Up", "Down"]]

[ble]
enabled = true
battery_adc_pin = "vddh"

[storage]
enabled = true

[split]
connection = "ble"

[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0

[split.central.matrix]
row2col = true
row_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P0_02", "P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]


[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6

[split.peripheral.matrix]
row2col = true
row_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P0_09", "P0_10", "P1_11", "P1_13", "P1_15", "P0_02"]

# Encoder on the left half (central)
[[input_device.encoder]]
pin_a = "P0_17"
pin_b = "P0_20"
phase = "resolution"
resolution = 4
reverse = false
internal_pullup = true

# Encoder on the right half (peripheral) — same PCB, same pins
[[input_device.encoder]]
pin_a = "P0_17"
pin_b = "P0_20"
phase = "resolution"
resolution = 4
reverse = false
internal_pullup = true

[[input_device.joystick]]
name = "default"
pin_x = "P0_31"
pin_y = "P0_29"
pin_z = "_"
transform = [[80, 0], [0, 80]]
bias = [29130, 29365]
resolution = 6

