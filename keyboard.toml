[keyboard]
name = "RoKi"
product_name = "RoKi Keyboard"
vendor_id = 0x4c4b
product_id = 0x524b
manufacturer = "RoKi"
chip = "nrf52840"

[rmk]
ble_profiles_num = 1
split_peripherals_num = 2

[host]
unlock_keys = [[0, 0], [0, 11]] # Keys at (row=0,col=0) and (row=0,col=1)

[layout]
rows = 5
cols = 12
layers = 2
matrix_map = """
(0, 0, L) (0, 1, L) (0, 2, L) (0, 3, L) (0, 4, L) (0, 5, L)    (0, 6, R) (0, 7, R) (0, 8, R) (0, 9, R) (0, 10, R) (0, 11, R)
(1, 0, L) (1, 1, L) (1, 2, L) (1, 3, L) (1, 4, L) (1, 5, L)    (1, 6, R) (1, 7, R) (1, 8, R) (1, 9, R) (1, 10, R) (1, 11, R)
(2, 0, L) (2, 1, L) (2, 2, L) (2, 3, L) (2, 4, L) (2, 5, L)    (2, 6, R) (2, 7, R) (2, 8, R) (2, 9, R) (2, 10, R) (2, 11, R)
(3, 0, L) (3, 1, L) (3, 2, L) (3, 3, L) (3, 4, L) (3, 5, L)    (3, 6, R) (3, 7, R) (3, 8, R) (3, 9, R) (3, 10, R) (3, 11, R)

(4, 0, L) (4, 1, L) (4, 2, L) (4, 3, L) (4, 4, L) (4, 5, L)    (4, 6, R) (4, 7, R) (4, 8, R) (4, 9, R) (4, 10, R) (4, 11, R)
"""

[[layer]] # Layer 0
keys = """
esc   1     2     3     4     5                         6     7     8     9     0     esc
Tab   Q     W     E     R     T                         Y     U     I     O     P     Grave
lsft  A     S     D     F     G                         H     J     K     L     slsh  rsft
MO(1) Z     X     C     V     B                         N     M     comm  .     bsls  MO(1)

        lctl  lwin  LAlt  spc   ent   encp0     encp1  bspc  spc   RAlt  rwin    rctl

"""
encoders = [["enc_0", "enc_1"], ["enc_2", "enc_3"]]


[[layer]] # Layer 1
keys = """

F1    F2    F3    F4    F5    F6                        F7    F8    F9    F10   F11   F12
_     brsls brqst clk2  clk3  clk1                      clk1  clk3  clk2  _     _     _
_     Quote _     rbrc  bsls  _                         Left  Down  Up    Right _     _
_     _     _     scln  _     _                         Minus Equal lbrc  _     _     _

        _     _     _     _     _     encp2     encp3   del   _     _     _       _

"""
encoders = [["enc_4", "enc_5"], ["enc_6", "enc_7"]]

[aliases]
clk1 = "ms_btn1"
clk2 = "ms_btn2"
clk3 = "ms_btn3"
brsls = "kp_slash"
brqst = "WM(int1, lsft)"
enc_0 = "Macro(0)"
enc_1 = "Macro(1)"
enc_2 = "Macro(2)"
enc_3 = "Macro(3)"
enc_4 = "Macro(4)"
enc_5 = "Macro(5)"
enc_6 = "Macro(6)"
enc_7 = "Macro(7)"
encp0 = "Macro(8)"
encp1 = "Macro(9)"
encp2 = "Macro(10)"
encp3 = "Macro(11)"

[ble]
enabled = true
default_tx_power = 0

[storage]
enabled = true
clear_storage = false

[split]
connection = "ble"

[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0
ble_addr = [0xde, 0x21, 0x8e, 0xc7, 0x2e, 0xce]

[split.central.matrix]
matrix_type = "direct_pin"
direct_pins = []

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
ble_addr = [0x44, 0x3e, 0x55, 0x00, 0x61, 0xd7]
[split.peripheral.matrix]
row2col = true
row_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P0_02", "P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]

[[split.peripheral.input_device.encoder]]
pin_a = "P0_17"
pin_b = "P0_20"
phase = "resolution"
resolution = 2
reverse = false
internal_pullup = true

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
ble_addr = [0x9f, 0xbb, 0xef, 0x6e, 0x95, 0xe3]
[split.peripheral.matrix]
row2col = true
row_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P0_09", "P0_10", "P1_11", "P1_13", "P1_15", "P0_02"]

[[split.peripheral.input_device.encoder]]
pin_a = "P0_17"
pin_b = "P0_20"
phase = "resolution"
resolution = 2
reverse = false
internal_pullup = true
