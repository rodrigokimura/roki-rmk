name: Build RMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "**"

env:
  LIBSSL: "libssl1.1_1.1.1f-1ubuntu2_amd64.deb"
  RUST_MIN_STACK: "67108864"

jobs:
  get_chip_name:
    runs-on: ubuntu-latest
    outputs:
      chip_name: ${{ steps.capture.outputs.chip_name }}
      project_name: ${{ steps.project.outputs.project_name }}
      artifact_prefix: ${{ steps.prefix.outputs.prefix }}
    steps:
      - uses: cargo-bins/cargo-binstall@main
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            libssl*.deb
          key: ${{ runner.os }}-libssl
      - name: Install libssl
        run: |
          [ ! -f $LIBSSL ] && wget http://nz2.archive.ubuntu.com/ubuntu/pool/main/o/openssl/$LIBSSL
          sudo dpkg -i $LIBSSL
      - name: Install rmkit
        run: cargo binstall rmkit -y
      - name: Get chip name
        id: capture
        run: |
          OUTPUT=$(rmkit get-chip --keyboard-toml-path keyboard.toml)
          echo "chip_name=$OUTPUT" >> $GITHUB_OUTPUT
      - name: Get project name
        id: project
        run: |
          OUTPUT=$(rmkit get-project-name --keyboard-toml-path keyboard.toml)
          echo "project_name=$OUTPUT" >> $GITHUB_OUTPUT
      - name: Compute artifact path prefix
        id: prefix
        run: |
          DIR=$(dirname -- "keyboard.toml")
          PREFIX=""
          if [ "$DIR" != "." ]; then
            PREFIX="$(printf '%s' "$DIR" | tr -c 'A-Za-z0-9._' '_')-"
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: get_chip_name
    if: needs.get_chip_name.outputs.chip_name != 'esp32s3'
    steps:
      - uses: cargo-bins/cargo-binstall@main
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            libssl*.deb
          key: ${{ runner.os }}-libssl
      - name: Install libssl
        run: |
          [ ! -f $LIBSSL ] && wget http://nz2.archive.ubuntu.com/ubuntu/pool/main/o/openssl/$LIBSSL
          sudo dpkg -i $LIBSSL
      - name: Install rmkit, flip-link and cargo-make
        run: cargo binstall cargo-make rmkit flip-link -y
      - name: Create firmware project
        working-directory: .
        run: rmkit create --keyboard-toml-path keyboard.toml --vial-json-path vial.json --target-dir rmk
      - name: Patch project for 2 peripherals
        working-directory: ./rmk
        run: |
          # Create peripheral2.rs with id = 1
          cat > src/peripheral2.rs << 'EOF'
          #![no_main]
          #![no_std]

          use rmk::macros::rmk_peripheral;

          #[rmk_peripheral(id = 1)]
          mod keyboard_peripheral {}
          EOF

          # Add peripheral2 binary to Cargo.toml
          cat >> Cargo.toml << 'EOF'

          [[bin]]
          name = "peripheral2"
          path = "src/peripheral2.rs"
          EOF

          # Get project name for file prefixes
          PROJECT_NAME="${{ needs.get_chip_name.outputs.project_name }}"

          # Append peripheral2 tasks to Makefile.toml
          cat >> Makefile.toml << EOF

          [tasks.objcopy-peripheral2]
          install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
            "objcopy",
            "--help",
          ] }
          command = "cargo"
          args = [
            "objcopy",
            "--release",
            "--bin",
            "peripheral2",
            "--",
            "-O",
            "ihex",
            "${PROJECT_NAME}-peripheral2.hex",
          ]
          dependencies = ["build"]

          [tasks.uf2-peripheral2]
          install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
            "hex-to-uf2",
            "--help",
          ] }
          command = "cargo"
          args = [
            "hex-to-uf2",
            "--input-path",
            "${PROJECT_NAME}-peripheral2.hex",
            "--output-path",
            "${PROJECT_NAME}-peripheral2.uf2",
            "--family",
            "nrf52840",
          ]
          dependencies = ["objcopy-peripheral2"]
          EOF

          # Update the uf2 task to depend on all three
          sed -i 's/dependencies = \["uf2-central", "uf2-peripheral"\]/dependencies = ["uf2-central", "uf2-peripheral", "uf2-peripheral2"]/' Makefile.toml
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rmk -> target"
          key: ${{ needs.get_chip_name.outputs.chip_name }}
      - name: Build firmware
        working-directory: ./rmk
        run: cargo build --release
      - name: Build uf2 firmware
        working-directory: ./rmk
        run: cargo make uf2 --release
      - name: Upload uf2 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.get_chip_name.outputs.artifact_prefix }}${{ needs.get_chip_name.outputs.project_name }}-firmware_uf2
          path: rmk/*.uf2
      - name: Upload hex artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.get_chip_name.outputs.artifact_prefix }}${{ needs.get_chip_name.outputs.project_name }}-firmware_hex
          path: rmk/*.hex
