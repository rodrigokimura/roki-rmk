# RoKi — RMK build-time constants.
#
# Read by rmk-types' build.rs (via KEYBOARD_TOML_PATH, set in this crate's
# .cargo/config.toml) to generate the compile-time constants rmk includes
# (NUM_BLE_PROFILE, SPLIT_PERIPHERALS_NUM, event channel sizes, …).
#
# Everything else about the keyboard — layout, keymap, pins, split wiring,
# encoders, direct-pin keys, bootmagic — is hand-written in src/ and
# documented in README.md; putting it here would have no effect, because the
# firmware does not use RMK's macro codegen.
#
# The sections below exist only because RMK's default event-channel sizes
# cover just its own built-in devices; the hand-written devices in src/
# exceed them (a shortfall panics at boot with "Failed to create
# publisher/subscriber for …").

# Default keyboard-event pubs = 4; raised for the extra direct-pin matrix
# (P0.22) publishing alongside the row/col matrix and the encoder on each
# half.
[event.keyboard]
pubs = 6

# Extra subscribers beyond RMK's built-ins:
#   - pointing:                 PointingProcessor on the central (left.rs)
#   - central_connected:        PeripheralBuzzer on the right half (devices.rs)
#   - connection_status_change: CentralBuzzer on the left half (devices.rs)
[event.pointing]
subs = 3

[event.central_connected]
subs = 2

[event.connection_status_change]
subs = 3

# Battery identification over BLE. With these set, the central's GATT table
# exposes one Battery Service per half, each with its own Characteristic User
# Description ("RoKi Left" / "RoKi Right"), and the right half's level —
# already forwarded over the split link — is reported separately.
# (Default: a single characteristic described as "Central".)
#
# Only the battery_* keys are read from these sections; rows/cols/matrix are
# required by RMK's TOML schema but unused by the hand-written firmware.
[split]
connection = "ble"

[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
battery_user_description = "RoKi Left"
[split.central.matrix]

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
# The right half measures VDDH/5 internally (see right.rs) — there is no
# real ADC pin. RMK's schema requires battery_adc_pin to pair with the
# description and uses it to include this peripheral in
# SPLIT_BATTERY_PERIPHERAL_IDS, so this is a placeholder string.
battery_adc_pin = "VDDH"
battery_user_description = "RoKi Right"
[split.peripheral.matrix]
