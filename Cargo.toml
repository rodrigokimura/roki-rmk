# RoKi firmware workspace
#   keyboard/  — split keyboard: left (central), right (peripheral), dongle
#   trackball/ — standalone BLE trackball (PMW3360 + 4 buttons)
#
# Two crates because RMK resolves layout/split constants per crate from its
# own keyboard.toml (KEYBOARD_TOML_PATH), and the two devices differ.
[workspace]
resolver = "3"
members = ["keyboard", "trackball"]

[workspace.package]
version = "0.3.0"
authors = ["Rodrigo Eiti Kimura <rodrigoeitikimura@gmail.com>"]
repository = "https://github.com/rodrigokimura/roki-rmk"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nrf-sdc = { version = "0.4.0", features = ["peripheral", "central", "nrf52840"] }
nrf-mpsl = { version = "0.4.0", features = ["critical-section-impl", "nrf52840"] }
bt-hci = { version = "0.10" }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "nfc-pins-as-gpio", "time"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-sync = "0.8"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
log = "0.4"
static_cell = "2"
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
