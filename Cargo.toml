[package]
name = "roki"
version = "0.2.0"
authors = ["Rodrigo Eiti Kimura <rodrigoeitikimura@gmail.com>"]
description = "RMK firmware for the RoKi split ergonomic keyboard (nice!nano v2 halves + USB dongle)"
repository = "https://github.com/rodrigokimura/roki-rmk"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# `dongle` is enabled on every binary: on the keyboard (central) it adds the
# dongle bond slot + the `SwitchToDongle` key; on the dongle it enables
# `rmk::dongle`. `vial` must be on both sides so the dongle relays Vial.
rmk = { version = "0.9", default-features = false, features = [
    "storage",
    "vial",
    "host_lock",
    "watchdog",
    "nrf52840_ble",
    "split",
    "dongle",
    "async_matrix",
    "adafruit_bl",
] }
nrf-sdc = { version = "0.4.0", features = [
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10" }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-nrf = { version = "0.11", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }
log = "0.4"
static_cell = "2"
# Needed by rmk's `#[derive(Event)]` macro expansion
embassy-sync = "0.8"

[features]
default = ["defmt"]
# Normal build: defmt over RTT (needs a debug probe to read).
defmt = ["dep:defmt", "dep:defmt-rtt", "dep:panic-probe", "rmk/defmt", "nrf-sdc/defmt", "nrf-mpsl/defmt", "bt-hci/defmt", "embassy-nrf/defmt", "embassy-time/defmt", "embassy-time/defmt-timestamp-uptime", "embassy-executor/defmt"]
# Debug build: logs over a USB CDC serial port instead of defmt.
#   cargo build --release --no-default-features --features usb_log --bin left
usb_log = ["rmk/usb_log"]


[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Left half: split central, the keyboard itself (talks to hosts and the dongle)
[[bin]]
name = "left"
path = "src/left.rs"

# Right half: split peripheral 0
[[bin]]
name = "right"
path = "src/right.rs"

# USB dongle: relays the bonded keyboard (HID + Vial) to the host
[[bin]]
name = "dongle"
path = "src/dongle.rs"

# Trackball: split peripheral 1 (PMW3360 + 4 buttons)
[[bin]]
name = "trackball"
path = "src/trackball.rs"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
